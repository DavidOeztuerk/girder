name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to publish, e.g. 5.0.0'
        required: true

permissions:
  contents: read
  # OIDC for Trusted Publishing on nuget.org. No persistent API key is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # Source Link needs the history

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="$REQUESTED_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable SemVer versions (x.y.z) may be published to nuget.org."
            exit 1
          fi

          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tags must use the exact form v$version."
            exit 1
          fi

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release commit is not part of origin/main."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Manual publishing is allowed only from the current origin/main commit."
            exit 1
          fi

          expected="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [ -z "$expected" ] || [ "$version" != "$expected" ]; then
            echo "::error::Requested version '$version' does not match Directory.Build.props ('$expected')."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - run: dotnet restore Noelia.slnx

      # Never publish something the tests have not passed. The release tag is
      # not proof: it points at a commit, not at a green run.
      - run: dotnet build Noelia.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.value }}
      - run: dotnet test Noelia.slnx --no-build -c Release

      - run: dotnet pack Noelia.slnx --no-build -c Release -p:Version=${{ steps.version.outputs.value }} -o packages

      # Fail closed: a missing variable or Trusted Publishing policy must make
      # the release fail instead of producing a green run that published no package.
      - name: Log in to nuget.org with OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --symbol-source https://api.nuget.org/v3/index.json \
            --symbol-api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
